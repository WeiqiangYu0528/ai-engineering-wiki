# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
#
# Site configuration for the AI Engineering Wiki (Quartz v5.0.0).
#
# Baseline is the file currently on `main` in WeiqiangYu0528/ai-engineering-wiki.
# Task 11.2 of .kiro/specs/wiki-site-experience makes three edits, all inside
# `plugins:`. `configuration:` and `layout:` are byte-identical to the baseline.
#
#   note-properties   hidePropertiesView: true             Req 12.2
#   explorer          options: collapse + group counts     Req 5.9, 8.1-8.5
#   favicon           a comment, and nothing else          Req 12.4
#
# Five settings below are load-bearing for the grouped published layout and are
# deliberately untouched. Each is marked at its plugin:
#
#   crawl-links `markdownLinkResolution: shortest`   the reason there is no
#                                                    wikilink rewriter (Req 5.6)
#   alias-redirects                                  emits the wiki/<slug>.html
#                                                    redirects (Req 5.8)
#   breadcrumbs                                      names the group (Req 5.10)
#   content-index                                    trimming is post-build,
#                                                    not a config change (Req 9.1)
#   analytics: null                                  no third-party analytics
#                                                    (Req 14.7)
configuration:
  pageTitle: AI Engineering Wiki
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  # Requirement 14.7: no third-party analytics, ever. `scripts/check-built-site.mjs`
  # loads a page sample and fails on a request to any known analytics host, so
  # this is asserted against the served bytes and not only declared here.
  analytics: null
  locale: en-US
  baseUrl: weiqiangyu0528.github.io/ai-engineering-wiki
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  # DO NOT CHANGE `markdownLinkResolution`. `shortest` resolves a bare basename
  # across directories, which is the whole reason the publish pipeline can move
  # pages into <domain>/<kind>/ without rewriting a single wikilink. The
  # pipeline pays for it with a basename-uniqueness invariant it fails the build
  # on (`group_collisions`). Set this to `absolute` or `relative` and every
  # cross-group link in 279 pages breaks at once.
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  # DO NOT DISABLE. Requirement 5.8's redirects are this plugin reading the
  # `aliases:` entry that tools/publish.py appends to the *published copy* of
  # every page (`wiki/<slug>`, the page's pre-grouping URL). It emits
  # wiki/<slug>.html with a meta-refresh, a canonical link and robots noindex.
  # There is no second emitter; turn this off and every previously published URL
  # 404s.
  - source: "@quartz-community/alias-redirects"
    enabled: true
  # Unchanged. Requirement 9.1's byte budget is met after the build, by
  # scripts/trim-search-index.mjs rewriting static/contentIndex.json against
  # .search-budget.json. Nothing here can express a per-page-type content limit,
  # so nothing here is asked to.
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  # Requirement 12.4 is satisfied here by *nothing*, and that is deliberate.
  #
  # This plugin accepts no options. Its factory is `() => ({ ... })` and the
  # source path is hardcoded as `joinSegments("quartz", "static", "icon.png")`.
  # A `favicon:` key or an `options:` block on this entry would be ignored
  # silently, which is worse than failing, because the stock icon would ship and
  # the config would claim otherwise.
  #
  # The project icon is installed by the workflow instead: task 12.2 copies this
  # repository's `static/icon.png` over
  # `$RUNNER_TEMP/quartz/quartz/static/icon.png` *before* `npx quartz build`.
  # scripts/check-built-site.mjs then asserts the served favicon resolves and
  # differs from the Quartz default (sha256 532d053e33c2c6bd...), so a workflow
  # that loses the copy step fails the gate rather than quietly regressing.
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  # Requirements 5.9 and 8.1 through 8.5. Four things to know before editing.
  #
  # ORDERING IS NOT CONFIGURED HERE, ON PURPOSE. Requirement 8.2 wants concept
  # pages ahead of reading notes. The default comparator sorts folders before
  # files and then by display name, and the publish pipeline names the kind
  # directories `concepts` < `entities` < `sources`, so alphabetical order *is*
  # the required order. No `sortFn` is supplied, which means the ordering is a
  # fact about directory names and survives any client that ignores these
  # options. `mapFn` below appends its count as a suffix for exactly this
  # reason: a suffix cannot reorder labels whose prefixes already differ.
  #
  # The one way to break that: the comparator sorts on *display name*, and a
  # kind directory falls back to its slug segment only because no page sits at
  # `<domain>/<kind>/index.md`. Add one, and its `title` becomes the label and
  # decides the position. Domain folders already work this way by design — their
  # label is the Map_Page title — which is fine, because Requirement 8.2 is
  # about order *within* a domain.
  #
  # GROUPING likewise comes from directories, not from options. The client
  # builds its trie with `insert(entry.slug.split("/"), ...)` and marks a node a
  # folder only while descending a slug segment, so `<domain>/<kind>/<slug>` is
  # what puts the 160 reading notes in their own group (Requirement 8.1).
  #
  # LABELS come from frontmatter `title`: the trie's `displayName` getter
  # prefers `data.title` over the slug segment, and a domain folder takes its
  # label from the Map_Page at `<domain>/index.md`. That is why no published
  # title carries a `source-` or `moc-` prefix and why Requirements 8.3 and 8.4
  # need no configuration.
  #
  # `folderClickBehavior: collapse` IS a change from the default `link`, and it
  # is a trade. Under `link` the client replaces `<button class="folder-button">`
  # with an `<a>` at render time and the only collapse control left is a bare
  # `<svg>`, which no keyboard can reach. Requirement 8.5 asks for a real
  # button and Requirement 11.6 needs something focusable to carry the
  # `:focus-visible` rule, so `collapse` it is. The cost: a domain's folder
  # label no longer links to its Map_Page. The breadcrumb (Requirement 5.10),
  # the Landing_Page entry paths and the catalog all still reach it.
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      # Requirement 8.5. Also the client's hardcoded default: the inline script
      # reads saved state as `state[slug] !== undefined ? state[slug] : true`
      # and never looks at this value, so in v5.0.0 this line documents the
      # intent rather than causing it. Written out so a future version that does
      # read it agrees with what the Reader already gets.
      folderDefaultState: collapsed
      # See the note above. This one is read: the client renders it as
      # `data-behavior` and branches on it both when building a folder row and
      # when handling a click.
      folderClickBehavior: collapse
      # The documented default, restated. In v5.0.0 the inline script applies
      # filter -> map -> sort unconditionally and ignores this array; it is
      # serialised into `data-data-fns` and never read back. Kept because map
      # must run before sort for the count suffix to be sorted on, and a future
      # client that honours the field should honour that order.
      order:
        - filter
        - map
        - sort
      # Requirement 5.9: every group states how many pages it holds.
      #
      # This is a function *source string*, which works because the component
      # serialises its options with `opts.mapFn?.toString()` -- the identity on a
      # string -- and the client rebuilds it with
      # `new Function("node", "(" + src + ")(node)")`. The plugin schema types
      # `options` as an open object, so a string where a function is expected
      # passes validation. Verified against the Quartz v5.0.0 client bundle and
      # exercised against a faithful reimplementation of its trie.
      #
      # Counts leaf pages in the subtree, so a domain reports its own total and
      # each kind directory reports its own. Folder nodes are not counted:
      # a domain's Map_Page *is* the folder node rather than a child of it, so
      # counting folders would report the index page as one of its own entries.
      #
      # Appending is not cumulative. `R()` rebuilds the trie from
      # contentIndex.json on every `nav` and `render` event, so each build
      # starts from fresh nodes and appends exactly once.
      #
      # Every access is guarded and nothing is logged, because both failure
      # modes are expensive: a throw inside `map` is caught by the client's
      # trie builder, which returns null and renders an empty Explorer, and a
      # console write fails scripts/check-console.mjs.
      #
      # FALLBACK, if this ever stops working: move the count into each
      # Map_Page's `title` in tools/build_index.py ("LLM Fundamentals (84)")
      # and delete this option. The explorer already prefers `title` over the
      # slug, so the labels read the same with no client capability involved.
      mapFn: |-
        (node) => {
          if (!node || node.isFolder !== true) return
          const segments = node.slugSegments
          if (!Array.isArray(segments) || segments.length === 0) return
          const tally = (branch) => {
            let total = 0
            const kids = Array.isArray(branch.children) ? branch.children : []
            for (const kid of kids) {
              if (!kid) continue
              if (kid.isFolder === true) total += tally(kid)
              else if (kid.data) total += 1
            }
            return total
          }
          const count = tally(node)
          if (count === 0) return
          const label = node.displayName || node.slugSegment || ''
          node.displayName = label + ' (' + count + ')'
        }
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  # DO NOT DISABLE. This is all of Requirement 5.10: the breadcrumb is what
  # names the domain and the kind on every page, and under
  # `folderClickBehavior: collapse` it is also the Reader's link back up to a
  # domain's Map_Page.
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  # THE FIRST THREE LINKS ARE NAVIGATION, NOT CREDITS. Requirements 11.10 and
  # 9.6 both land here, for the same underlying reason: the Explorer is built
  # client-side.
  #
  # The Explorer ships an empty <ul> and fills it on the `nav` event from
  # contentIndex.json, so with JavaScript unavailable it contributes no links at
  # all and the footer is the only navigation left on the page. That is
  # Requirement 11.10, and the first real CI run failed it: 2 of 3 sampled pages
  # had no script-free route to the catalog. `page-title` already covers the
  # route to the Landing_Page — it emits `pathToRoot(slug)`, so `../..` at depth
  # 2 — but `byPageType` strips the whole `left` position on the 404 page, which
  # takes page-title with it, so `Start here` is repeated here deliberately
  # rather than left to depend on a component another layout can remove.
  #
  # Requirement 9.6 is the same link seen from the other end. The five
  # Catalog_Pages are `unlisted`, which keeps them out of contentIndex.json to
  # meet the byte budget — and the Explorer, the graph and search all read that
  # one file, so `unlisted` costs sidebar presence too. tools/publish.py links
  # all five from the Landing_Page, which discharges 9.6 as written ("linked
  # from the Landing_Page or the site footer"), but that is one page out of 293.
  # `Catalog` and `Source summaries` make the two registers reachable from
  # every page instead of only from the one a Reader may never land on.
  # `open-questions` and `log` are deliberately NOT here: they stay
  # Landing_Page-only, because a footer that lists every register is a sitemap.
  #
  # THESE MUST BE ABSOLUTE URLs, AND THAT IS A LIMITATION, NOT A PREFERENCE.
  # This plugin renders `Object.entries(links)` straight into `href` with no
  # resolution step — verified in
  # node_modules/@quartz-community/footer/dist/components/index.js, whose
  # component takes only `{displayClass, cfg}` and never reads `fileData`, so it
  # cannot know the page's depth. Whatever is written here ships byte-for-byte
  # on all 293 pages — confirmed on a real build by diffing the emitted <footer>
  # of catalog.html (depth 0) against llm-fundamentals/concepts/scaling-laws.html
  # (depth 2): identical, every href unchanged.
  #
  # All four candidate forms were measured against a real build. Each one fails
  # either the Reader or the gate, and no form satisfies both:
  #
  #   https://…/ai-engineering-wiki/catalog   correct everywhere it is served
  #                                           (GET /ai-engineering-wiki/NOTICE
  #                                           and /trust both 200). Invisible to
  #                                           `nojs-nav` — see KNOWN GAP below.
  #   /catalog                                makes `nojs-nav` PASS, and 404s for
  #                                           every Reader: the site is served
  #                                           from /ai-engineering-wiki/, and GET
  #                                           weiqiangyu0528.github.io/catalog
  #                                           returns 404 while
  #                                           /ai-engineering-wiki/ returns 200.
  #                                           `links-resolve` does not catch it —
  #                                           it resolves against the build root,
  #                                           so it is only counted in that
  #                                           check's root-absolute note (332
  #                                           hrefs, "404 under a path-prefixed
  #                                           baseURL"). A green gate and a
  #                                           broken site is the worst trade on
  #                                           offer; do not take it.
  #   /ai-engineering-wiki/catalog            correct in production, but
  #                                           `resolveHref` reports `missing` on
  #                                           every page, so it fails
  #                                           `links-resolve` outright
  #   catalog                                 depth-0 only. Measured: bare
  #                                           `catalog-sources` took
  #                                           `links-resolve` from 20 findings to
  #                                           342, one per page below the root
  #
  # Do NOT "fix" these to root-relative form. It works in *content* — a
  # root-absolute href in markdown is rewritten by crawl-links against the
  # page's depth, measured as `/trust` -> `../../trust` at depth 2 — and that
  # rewriting is exactly what does not happen to a component option. The cost of
  # absolute URLs is that a fork or a local preview sends these three links to
  # the production host; the cost of root-relative would be a 404 for every
  # Reader, so this is the cheaper of the two.
  #
  # KNOWN GAP, AND REQUIREMENT 11.10 IS NOT DISCHARGED HERE. `nojs-nav` cannot
  # see these links and cannot be made to. Its `resolveHref` skips any href
  # matching /^[a-z][a-z0-9+.\-]*:/ as "absolute URL or non-http scheme", and the
  # check counts only anchors that resolve to a built file, so an absolute
  # catalog link scores zero no matter how correct it is for a Reader. Confirmed
  # on a real build: with all three links above in place, `nojs-nav` still fails
  # 2 of 3 sampled pages, reporting exactly the same "no link to the catalog" it
  # reported before they were added.
  #
  # The links stay anyway, because they are correct for the Reader and they are
  # what discharges Requirement 9.6 on 293 pages instead of 1. The gate is the
  # thing that is wrong here, not the config.
  #
  # WHERE THE ACTUAL FIX GOES: a depth-aware relative href, which only a
  # *content*-level link can produce. The asymmetry is verified in both
  # directions on one build — a root-absolute href in a component option ships
  # verbatim, while the same string in markdown is rewritten by crawl-links
  # against the page's depth. tools/publish.py already relies on this: the
  # `kb-header` aside it injects carries a literal `<a href="/trust">`, and that
  # shipped as `../../trust` at depth 2. One more anchor in that same injected
  # block — `<a href="/catalog">` — becomes `../../catalog`, which resolves in
  # the build tree, is correct under the path prefix, and is what `nojs-nav`
  # is looking for. That is a publish-pipeline change, not a config change.
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        Start here: https://weiqiangyu0528.github.io/ai-engineering-wiki/
        Catalog: https://weiqiangyu0528.github.io/ai-engineering-wiki/catalog
        Source summaries: https://weiqiangyu0528.github.io/ai-engineering-wiki/catalog-sources
        Source: https://github.com/WeiqiangYu0528/ai-engineering-wiki
        Attribution: https://weiqiangyu0528.github.io/ai-engineering-wiki/NOTICE
        What is checked: https://weiqiangyu0528.github.io/ai-engineering-wiki/trust
        Built with Quartz: https://github.com/jackyzha0/quartz
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  # ENABLED, WITH ITS VIEW HIDDEN. Requirement 12.2 wants the properties table
  # gone; it does NOT want frontmatter parsing gone, and in this plugin set those
  # are the same plugin.
  #
  # THIS WAS `enabled: false` AND IT BROKE THE ENTIRE SITE. Measured on a real
  # build: `note-properties` is the only plugin here that runs
  # remark-frontmatter, and its transformer ends with an unconditional
  # `file.data.frontmatter = data`. Disable it and nothing parses the YAML block,
  # so on all 293 pages the frontmatter rendered as visible body text -- `---`
  # became an <hr/> and `type:`, `title:`, `summary:`, `aliases:` became a
  # paragraph and a bullet list at the top of every page. Everything downstream
  # of `file.data.frontmatter` went with it: no `title`, so article-title emitted
  # no <h1> on any of the 293 content pages (only Quartz's own 34 folder and tag
  # pages had one); no breadcrumbs; descriptions fell back to body text; the
  # `aliases:` entries never reached alias-redirects, so 1 redirect stub was
  # emitted instead of 279 and every pre-grouping URL 404'd; and `unlisted: true`
  # never reached the content index, so the activity log stayed searchable. Nine
  # of nineteen checks in scripts/check-built-site.mjs failed on that one cause.
  #
  # `hidePropertiesView: true` is the correct lever. The parse is unconditional,
  # and the component starts with
  #   if (noteProps.showProperties !== true && noteProps.hideView) return null
  # so it emits NO markup rather than hiding it with CSS -- which is what lets
  # check-built-site.mjs's no-properties-table check still pass. Verified on a
  # real build: 0 of 318 pages carry note-properties markup.
  #
  # Do not set this back to `enabled: false` to satisfy Requirement 12.2. The
  # table is what 12.2 forbids, and hiding the view is what removes it; disabling
  # the plugin removes the table by removing the frontmatter, which is not the
  # same thing and is not survivable.
  #
  # One caveat, since the component's guard reads it first: a page setting
  # `quartz-properties-show: true` in its own frontmatter overrides `hideView`
  # and renders the table. No published page sets it, and nothing in
  # tools/publish.py writes it.
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      # See the block above: true keeps the frontmatter parse and emits no
      # markup. This is the whole of Requirement 12.2.
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  # Unchanged, and required by task 10.2: the publish pipeline writes
  # `unlisted: true` into the published frontmatter of the five Catalog_Pages.
  # This plugin only copies that value onto `file.data`; the content-index
  # emitter is what skips the entry. The page is still emitted and still
  # reachable by URL, which is why Requirement 9.6 asks the Landing_Page and the
  # footer to link it -- `unlisted` also removes it from the Explorer.
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
